name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # APPLE_SIGNING_IDENTITY="-"：无 Apple 开发者证书时做 ad-hoc 签名，
      # Apple Silicon 上未签名的 .app 会被系统判定为已损坏而无法启动
      - name: Build dmg
        run: npx tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"

      # 冒烟测试：直接用 .app 里打包的 node sidecar 启动后端，
      # 验证 /api/health 可访问，防止"构建成功但 Mac 上起不来"
      - name: Smoke test bundled backend
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/小勤画图.app"
          SCRIPT="$APP/Contents/Resources/server/server/index.js"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$APP/Contents/Resources/resources/server/server/index.js"
          fi
          echo "backend script: $SCRIPT"
          DATA_DIR="$(mktemp -d)"
          PORT=17892 DATA_DIR="$DATA_DIR" "$APP/Contents/MacOS/node-aarch64-apple-darwin" "$SCRIPT" &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:17892/api/health; then
              echo ""
              echo "SMOKE_OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "SMOKE_FAILED: backend not healthy after 20s"
          exit 1

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
