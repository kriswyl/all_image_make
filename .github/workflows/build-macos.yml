name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # APPLE_SIGNING_IDENTITY="-"：无 Apple 开发者证书时做 ad-hoc 签名，
      # Apple Silicon 上未签名的 .app 会被系统判定为已损坏而无法启动
      - name: Build dmg
        run: npx tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"

      # tauri 打包器偶尔会把 externalBin 放到非标准位置（或缺失），
      # 而 tauri-plugin-shell 运行时按“主程序目录/node-<triple>”查找 sidecar。
      # 打印实际布局、把 node 归位、重签名，最后由下一步重打 dmg。
      - name: Normalize sidecar location and diagnose layout
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/小勤画图.app"
          echo "=== Contents/MacOS ==="
          ls -la "$APP/Contents/MacOS/" || true
          echo "=== node binaries in bundle ==="
          find "$APP" -name 'node*' -type f -exec ls -la {} \; || true
          EXPECTED="$APP/Contents/MacOS/node-aarch64-apple-darwin"
          if [ ! -f "$EXPECTED" ]; then
            FOUND="$(find "$APP" -name 'node-aarch64-apple-darwin' -type f | head -1 || true)"
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$EXPECTED"
              chmod 755 "$EXPECTED"
              echo "copied sidecar into place: $FOUND -> $EXPECTED"
            else
              echo "::warning::node-aarch64-apple-darwin not found anywhere in bundle"
            fi
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" || true

      # 冒烟测试：直接用 .app 里打包的 node sidecar 启动后端，
      # 验证 /api/health 可访问，防止"构建成功但 Mac 上起不来"
      - name: Smoke test bundled backend
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/小勤画图.app"
          SCRIPT="$APP/Contents/Resources/server/server/index.js"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$APP/Contents/Resources/resources/server/server/index.js"
          fi
          echo "backend script: $SCRIPT"
          NODE_BIN="$APP/Contents/MacOS/node-aarch64-apple-darwin"
          if [ ! -f "$NODE_BIN" ]; then
            NODE_BIN="$(find "$APP" -name 'node-aarch64-apple-darwin' -type f | head -1)"
          fi
          echo "node binary: $NODE_BIN"
          DATA_DIR="$(mktemp -d)"
          PORT=17892 DATA_DIR="$DATA_DIR" "$NODE_BIN" "$SCRIPT" &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:17892/api/health; then
              echo ""
              echo "SMOKE_OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "SMOKE_FAILED: backend not healthy after 20s"
          exit 1

      # 归位/重签名后 .app 已变化，从它重打 dmg 覆盖 tauri 生成的旧包
      - name: Repack dmg from normalized app
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/小勤画图.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "小勤画图" -srcfolder "$APP" -ov -format UDZO "$DMG_DIR/小勤画图_${VERSION}_aarch64.dmg"
          ls -la "$DMG_DIR"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
