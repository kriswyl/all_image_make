name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # APPLE_SIGNING_IDENTITY="-"：无 Apple 开发者证书时做 ad-hoc 签名，
      # Apple Silicon 上未签名的 .app 会被系统判定为已损坏而无法启动
      - name: Build dmg
        run: npx tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"

      # 打印 .app/.dmg 实际布局，动态解析 .app 路径供后续步骤使用。
      # tauri v2 在 macOS 上把 sidecar 命名为不带 triple 的 node。
      # tauri --bundles dmg 打完会把中间产物 .app 删除，所以冒烟测试
      # 需要挂载 dmg、取出 .app 再验证——这也最接近用户真实安装路径
      - name: Smoke test bundled backend (from dmg)
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)"
          echo "dmg: $DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly
          APP="$(find "$MOUNT" -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "mounted app: $APP"
          echo "=== Contents/MacOS ==="
          ls -la "$APP/Contents/MacOS/"
          # dmg 只读，把 .app 拷出来再跑
          TEST_APP="$(mktemp -d)/小勤画图.app"
          cp -R "$APP" "$TEST_APP"
          hdiutil detach "$MOUNT"
          echo "FIXED_APP=$TEST_APP" >> "$GITHUB_ENV"

          # 签名体检：hardened runtime 下 node 的 V8 需要 allow-jit 授权，
          # 否则 mmap PROT_EXEC 被拒，报 "Failed to reserve virtual memory"
          NODE_BIN="$TEST_APP/Contents/MacOS/node"
          if [ ! -f "$NODE_BIN" ]; then
            NODE_BIN="$(find "$TEST_APP/Contents/MacOS" -name 'node*' -type f | head -1)"
          fi
          echo "node binary: $NODE_BIN"
          echo "=== node codesign flags ==="
          codesign -dvv "$NODE_BIN" 2>&1 | grep -E "Identifier=|CodeDirectory flags=" || true
          ENTITLEMENTS="$(codesign -d --entitlements :- "$NODE_BIN" 2>/dev/null || true)"
          echo "=== node entitlements ==="
          echo "$ENTITLEMENTS"
          IS_HARDENED="$(codesign -dvv "$NODE_BIN" 2>&1 | grep -c 'CodeDirectory flags=.*runtime' || true)"
          HAS_JIT="$(printf '%s' "$ENTITLEMENTS" | grep -c allow-jit || true)"
          if [ "$IS_HARDENED" -ge 1 ] && [ "$HAS_JIT" -eq 0 ]; then
            echo "::warning::node sidecar 在 hardened runtime 下缺少 allow-jit，重签为普通 ad-hoc 并重打 dmg"
            codesign --force --deep --sign - "$TEST_APP"
            echo "RESIGNED=1" >> "$GITHUB_ENV"
          fi

          SCRIPT="$TEST_APP/Contents/Resources/server/server/index.js"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$TEST_APP/Contents/Resources/resources/server/server/index.js"
          fi
          echo "backend script: $SCRIPT"
          ls -la "$SCRIPT"
          DATA_DIR="$(mktemp -d)"
          PORT=17892 DATA_DIR="$DATA_DIR" "$NODE_BIN" "$SCRIPT" &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:17892/api/health; then
              echo ""
              echo "SMOKE_OK"
              exit 0
            fi
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              echo "SMOKE_FAILED: node exited early"
              wait "$NODE_PID" || echo "node exit code: $?"
              exit 1
            fi
            sleep 0.5
          done
          echo "SMOKE_FAILED: backend not healthy after 20s"
          exit 1

      # 兜底重签后 .app 的签名已变，用它重打 dmg，保证上传的安装包可直接运行
      - name: Repack dmg after re-sign
        if: env.RESIGNED == '1'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "小勤画图" -srcfolder "${FIXED_APP:?}" -ov -format UDZO "$DMG_DIR/小勤画图_${VERSION}_aarch64.dmg"
          ls -la "$DMG_DIR"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
