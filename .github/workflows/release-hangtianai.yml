name: Release Hangtianai

# 航天ai 的独立发布链路。
#
# 为什么和主版分成两个 workflow：
#   · 主版 tag 会同时触发两边，但 Gitee 出问题不能把 GitHub 的主版发布一起拖红；
#   · 两边用的是不同的签名私钥和不同的产物仓库，放在一个文件里容易串。
#
# 触发方式：
#   · 推 v* 标签 —— 跟随主版发版，自动出一份航天ai；
#   · 手动 —— 补发某次构建（填已有 tag）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的 tag（如 v2.4.7）；留空则用当前 ref"
        required: false
        type: string

permissions:
  contents: read

env:
  BRAND: hangtianai
  GITEE_REPO: cqgsdx_0/hangtianai-releases
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 两个品牌不能共用 Rust 缓存：target/ 里的产物带 productName 和
          # 编译期注入的端口，混用会打出「名字是航天ai、端口是 17892」的包
          key: ${{ env.BRAND }}

      - name: Install dependencies
        run: npm ci

      # 私钥一旦丢失就再也无法给已安装用户推送更新，所以它只存在两处：
      # 本机 %USERPROFILE%\.tauri\hangtianai-updater.key 与本仓库 secret。
      - name: Check signing secret
        shell: bash
        env:
          KEY: ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 HANGTIANAI_SIGNING_PRIVATE_KEY。请把 ~/.tauri/hangtianai-updater.key 的内容添加到仓库 Secrets。"
            exit 1
          fi

      - name: Build NSIS installer
        shell: bash
        env:
          CHATCANVAS_BRAND: ${{ env.BRAND }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY }}
          # 密钥生成时用的是 --ci（无密码）。这里必须显式给空串：
          # 变量缺失时 Tauri CLI 会尝试交互式读密码，在没有 TTY 的 runner 上直接卡死。
          # 将来若给密钥加了密码，改成 ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY_PASSWORD }}。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/brand.mjs tauri build --bundles nsis

      # 统一改写成 ASCII 产物名，更新清单里的 URL 才能写死。
      - name: Collect artifacts
        shell: bash
        env:
          CHATCANVAS_BRAND: ${{ env.BRAND }}
        run: node scripts/package-installer.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-hangtianai
          path: |
            artifacts/hangtianai-*-win-x64-setup.exe
            artifacts/hangtianai-*-win-x64-setup.exe.sig
          if-no-files-found: error

  publish-gitee:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: windows-hangtianai
          path: dist

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          EXE="dist/hangtianai-v${VERSION}-win-x64-setup.exe"
          [ -f "$EXE" ] || { echo "::error::找不到安装包 $EXE"; exit 1; }
          [ -f "$EXE.sig" ] || { echo "::error::找不到签名 $EXE.sig"; exit 1; }
          npx tsx scripts/write-latest-json.ts \
            --version "$VERSION" \
            --file-name "$(basename "$EXE")" \
            --base-url "https://gitee.com/${GITEE_REPO}/releases/download/${RELEASE_TAG}" \
            --signature "${EXE}.sig" \
            --changelog "CHANGELOG-hangtianai.md" \
            --out latest.json
          cat latest.json

      # 顺序不能反：先传不可变附件，再切 updater 指向。
      # 中间失败时用户仍会看到旧清单，不会拿到 404 的地址。
      - name: Publish to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CHATCANVAS_BRAND: ${{ env.BRAND }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          node scripts/publish-gitee-release.mjs "${RELEASE_TAG}" \
            "dist/hangtianai-v${VERSION}-win-x64-setup.exe" \
            "dist/hangtianai-v${VERSION}-win-x64-setup.exe.sig" \
            --updater latest.json
