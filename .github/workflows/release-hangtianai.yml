name: Release Hangtianai

# 航天ai 的独立发布链路。
#
# 为什么和主版分成两个 workflow：
#   · 主版 tag 会同时触发两边，但 Gitee 出问题不能把 GitHub 的主版发布一起拖红；
#   · 两边用的是不同的签名私钥和不同的产物仓库，放在一个文件里容易串。
#
# 触发方式：
#   · 推 v* 标签 —— 跟随主版发版，自动出一份航天ai；
#   · 手动 —— 补发某次构建（填已有 tag）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的 tag（如 v2.4.7）；留空则用当前 ref"
        required: false
        type: string

permissions:
  # 建 GitHub Release 需要写权限；Gitee 那边用的是自己的令牌
  contents: write

env:
  BRAND: hangtianai
  GITEE_REPO: cqgsdx_0/hangtianai-releases
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  # ── macOS：只出 Apple Silicon 的 dmg，不参与自动更新。
  #
  # 两个原因让它和 Windows 完全解耦：
  #   1. 这版不做自动更新（ad-hoc 签名下替换 .app 会被 Gatekeeper 判成篡改），
  #      所以关掉 createUpdaterArtifacts，**不需要任何签名私钥**；
  #   2. Gitee 单附件上限 100 MB，而 dmg 通常 90–110 MB，塞不进去，
  #      因此产物只发 GitHub Release，Gitee 那边不参与。
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ env.BRAND }}-macos

      - name: Install dependencies
        run: npm ci

      # APPLE_SIGNING_IDENTITY="-"：没有 Apple 开发者证书时做 ad-hoc 签名，
      # 否则 Apple Silicon 上未签名的 .app 会被系统直接判定为已损坏。
      - name: Build dmg (arm64)
        env:
          CHATCANVAS_BRAND: ${{ env.BRAND }}
          APPLE_SIGNING_IDENTITY: "-"
        run: node scripts/brand.mjs tauri build --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-hangtianai
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    # 主版的签名私钥放在 `image_key` 环境里，仓库级反而没有。声明同一个 environment
    # 才能读到环境级 secret；同时仓库级的同名 secret 仍然可用，两种放法都兼容。
    environment: image_key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 两个品牌不能共用 Rust 缓存：target/ 里的产物带 productName 和
          # 编译期注入的端口，混用会打出「名字是航天ai、端口是 17892」的包
          key: ${{ env.BRAND }}

      - name: Install dependencies
        run: npm ci

      # 私钥一旦丢失就再也无法给已安装用户推送更新，所以它只存在两处：
      # 本机 %USERPROFILE%\.tauri\hangtianai-updater.key 与仓库 Secret。
      #
      # 只从 Secrets 读，**不用** `secrets || vars` 回退：
      # GitHub 只会遮盖 Secrets 的值，Variables 在日志和设置页都是明文，
      # 私钥放进去等于公开。配到 Variables 标签页是会失败，但这是刻意的。
      - name: Check signing secret
        shell: bash
        env:
          KEY: ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY }}
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 只打印长度，不打印内容，便于区分「没配」和「配错名字」
          echo "私钥长度: ${#KEY}（预期 348）"
          echo "Gitee 令牌长度: ${#TOKEN}（预期 32）"
          if [ -z "$KEY" ]; then
            echo "::error::读不到 HANGTIANAI_SIGNING_PRIVATE_KEY。请确认：Settings → Secrets and variables → Actions → 选 Secrets 标签 → 名字必须是 HANGTIANAI_SIGNING_PRIVATE_KEY，值是 ~/.tauri/hangtianai-updater.key 的全部内容（348 字符单行）。"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::读不到 GITEE_TOKEN，Gitee 发布会失败。"
            exit 1
          fi

      - name: Build NSIS installer
        shell: bash
        env:
          CHATCANVAS_BRAND: ${{ env.BRAND }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY }}
          # 密钥生成时用的是 --ci（无密码）。这里必须显式给空串：
          # 变量缺失时 Tauri CLI 会尝试交互式读密码，在没有 TTY 的 runner 上直接卡死。
          # 将来若给密钥加了密码，改成 ${{ secrets.HANGTIANAI_SIGNING_PRIVATE_KEY_PASSWORD }}。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/brand.mjs tauri build --bundles nsis

      # 统一改写成 ASCII 产物名，更新清单里的 URL 才能写死。
      - name: Collect artifacts
        shell: bash
        env:
          CHATCANVAS_BRAND: ${{ env.BRAND }}
        run: node scripts/package-installer.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-hangtianai
          path: |
            artifacts/hangtianai-*-win-x64-setup.exe
            artifacts/hangtianai-*-win-x64-setup.exe.sig
          if-no-files-found: error

  # ── macOS 产物发 GitHub：Gitee 放不下（单附件 100 MB），
  #    所以这里用独立 tag `hangtianai-vX.Y.Z`，和主版的 vX.Y.Z 分开归档。
  #    这条链路不依赖任何 Secret，Windows 那边签名失败也不影响它。
  publish-github:
    needs: build-macos
    if: always() && needs.build-macos.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-hangtianai
          path: dist/macos

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: hangtianai-${{ env.RELEASE_TAG }}
          # 归档标签必须钉在本次构建的源码上。不传这个字段时，新标签会指向
          # 仓库默认分支的最新提交——补发旧版本时就和实际构建的代码对不上。
          target_commitish: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: 航天AI ${{ env.RELEASE_TAG }}（macOS）
          # 不能抢主版的 Latest：否则用户打开仓库首页，置顶的是只含 Mac 包的归档
          make_latest: false
          body: |
            航天AI macOS 安装包（Apple Silicon / arm64）。

            这一版不参与自动更新，请从本页手动下载 DMG。Intel 芯片的 Mac 暂不提供。

            Windows 版在 Gitee 发布页：https://gitee.com/cqgsdx_0/hangtianai-releases/releases
          files: dist/macos/*.dmg
          fail_on_unmatched_files: true

  publish-gitee:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    # Gitee 令牌和签名私钥放在同一处，读法保持一致
    environment: image_key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: windows-hangtianai
          path: dist

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          EXE="dist/hangtianai-v${VERSION}-win-x64-setup.exe"
          [ -f "$EXE" ] || { echo "::error::找不到安装包 $EXE"; exit 1; }
          [ -f "$EXE.sig" ] || { echo "::error::找不到签名 $EXE.sig"; exit 1; }
          npx tsx scripts/write-latest-json.ts \
            --version "$VERSION" \
            --file-name "$(basename "$EXE")" \
            --base-url "https://gitee.com/${GITEE_REPO}/releases/download/${RELEASE_TAG}" \
            --signature "${EXE}.sig" \
            --changelog "CHANGELOG-hangtianai.md" \
            --out latest.json
          cat latest.json

      # 顺序不能反：先传不可变附件，再切 updater 指向。
      # 中间失败时用户仍会看到旧清单，不会拿到 404 的地址。
      - name: Publish to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CHATCANVAS_BRAND: ${{ env.BRAND }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          node scripts/publish-gitee-release.mjs "${RELEASE_TAG}" \
            "dist/hangtianai-v${VERSION}-win-x64-setup.exe" \
            "dist/hangtianai-v${VERSION}-win-x64-setup.exe.sig" \
            --updater latest.json
