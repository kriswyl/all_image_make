name: Release

on:
  workflow_dispatch:
    inputs:
      # 打 tag 推送会自动触发；这里用于「tag 已存在但上一次没能建 release」
      # 的补挂场景：填上已有的 tag，会按该 tag 的源码重建并挂到它的 Release 上
      release_tag:
        description: "要挂 Release 的 tag（如 v2.2.0）；留空则只出构建产物"
        required: false
        type: string
  push:
    tags: ["v*"]

# 建 Release、传附件、更新 latest.json 都需要写权限。
# 不声明的话 GITHUB_TOKEN 只读，会在 create-a-release 上报
# "Resource not accessible by integration"（403）——v2.0.0 就是这么失败的
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  # ── macOS：两个架构各出一份 dmg（Intel Mac 装不了 arm64 包）。
  #    这版不参与自动更新（ad-hoc 签名下自动替换 .app 会被 Gatekeeper 判成篡改），
  #    客户端只提示 + 跳下载页。
  build-macos:
    name: build-macos (${{ matrix.arch }})
    strategy:
      # 一个架构失败不影响另一个：x64 的冒烟测试依赖 Rosetta，失败了也能拿到 arm64
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            dmg_arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
            dmg_arch: x64
    runs-on: macos-latest
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/dmg
    steps:
      - uses: actions/checkout@v4
        with:
          # 注意用 github.event.inputs 而不是 inputs：inputs 上下文只在
          # workflow_dispatch / workflow_call 下存在，push 事件下引用它会让
          # GitHub 在解析阶段就报 Unrecognized named-value: 'inputs'，
          # 把打 tag 这条正常路径一起弄坏
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 交叉编译 Intel 包需要额外装 x86_64 的 std，rustup 不会自带
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 两个架构的编译产物不能共用一个缓存目录，否则会互相覆盖
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # APPLE_SIGNING_IDENTITY="-"：无 Apple 开发者证书时做 ad-hoc 签名，
      # Apple Silicon 上未签名的 .app 会被系统判定为已损坏而无法启动
      # 这版 macOS 不参与自动更新，因此显式关掉更新包产物：
      # 否则 createUpdaterArtifacts 会要求 macOS 构建也带 minisign 私钥，
      # 白白多出一份不会被使用的 .app.tar.gz。
      # --target 会让 prepare-tauri.mjs 按目标架构准备 node sidecar（见 TAURI_ENV_TARGET_TRIPLE）。
      - name: Build dmg (${{ matrix.arch }})
        run: node scripts/brand.mjs tauri build --target "$TARGET" --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          APPLE_SIGNING_IDENTITY: "-"

      # x64 的冒烟测试要在 arm64 runner 上跑 Intel 二进制，需要 Rosetta 2。
      # GitHub 的 arm64 镜像默认装好了，这里只是兜底：装不上就跳过，不让它把
      # arm64 的产物一起拖失败。
      - name: Ensure Rosetta for x64 smoke test
        if: matrix.arch == 'x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || echo "::warning::Rosetta 不可用，跳过 x64 冒烟测试"

      # 打印 .app/.dmg 实际布局，动态解析 .app 路径供后续步骤使用。
      # tauri v2 在 macOS 上把 sidecar 命名为不带 triple 的 node。
      # tauri --bundles dmg 打完会把中间产物 .app 删除，所以冒烟测试
      # 需要挂载 dmg、取出 .app 再验证——这也最接近用户真实安装路径
      # 冒烟只做「能验证的验证」，且**不阻塞发布**：
      #   · 静态：把 .app 主程序与 node sidecar 的 Mach-O 架构打出来，和 matrix 目标比对；
      #   · 动态：尽力跑一次后端健康检查（x64 只能靠 Rosetta 翻译，结论仅作参考）。
      # 两个坑必须避开：
      #   1) runner 调 bash 时自带 -e，`set -uo` 关不掉它。任何未豁免的失败命令都会中断整步，
      #      所以这里显式 `set +e`，全部失败自己兜。
      #   2) `find ... | head -1` 在 pipefail 下会因 SIGPIPE 随机返回 141，表现为「有时绿有时红」。
      #      统一改用 `find -print -quit`。
      - name: Smoke test bundled backend (from dmg)
        run: |
          exec > >(tee "$RUNNER_TEMP/smoke-${{ matrix.arch }}.log") 2>&1
          set +e +o pipefail
          EXPECT_ARCH="x86_64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then EXPECT_ARCH="arm64"; fi
          warn() { echo "::warning::$1"; exit 0; }
          first() { find "$1" -name "$2" -print -quit 2>/dev/null; }

          DMG="$(first "$BUNDLE_DIR" '*.dmg')"
          echo "dmg: $DMG"
          [ -n "$DMG" ] || warn "没找到 dmg，跳过冒烟"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly || warn "dmg 挂载失败，跳过冒烟"
          APP="$(mktemp -d)/app"
          cp -R "$MOUNT"/*.app "$APP" 2>/dev/null || warn "dmg 里没有 .app，跳过冒烟"
          echo "=== Contents/MacOS ==="
          ls -la "$APP/Contents/MacOS/"
          TEST_APP="$APP"
          hdiutil detach "$MOUNT" >/dev/null 2>&1 || true

          NODE_BIN="$TEST_APP/Contents/MacOS/node"
          [ -f "$NODE_BIN" ] || NODE_BIN="$(first "$TEST_APP/Contents/MacOS" 'node*')"
          echo "node binary: $NODE_BIN"
          [ -n "$NODE_BIN" ] || warn "包内没有 node sidecar（结构性缺陷，请检查 externalBin）"

          # ── 1) 架构（唯一能可靠交叉验证的部分）──────────────────────────
          echo "=== arch check（期望 $EXPECT_ARCH）==="
          file "$TEST_APP/Contents/MacOS/"* 2>&1 | sed 's/^/  /'
          NODE_DESC="$(file -b "$NODE_BIN" 2>&1)"
          echo "sidecar: $NODE_DESC"
          case "$NODE_DESC" in
            *"$EXPECT_ARCH"*) echo "sidecar 架构正确" ;;
            *) echo "::error::sidecar 架构与目标 $EXPECT_ARCH 不一致：$NODE_DESC" ;;
          esac

          # ── 2) 签名体检（缺 allow-jit 就重签，保证能启动）──────────────
          echo "=== node codesign flags ==="
          codesign -dvv "$NODE_BIN" 2>&1 | grep -E "Identifier=|CodeDirectory flags="
          ENTITLEMENTS="$(codesign -d --entitlements :- "$NODE_BIN" 2>/dev/null)"
          echo "=== node entitlements ==="
          echo "$ENTITLEMENTS"
          IS_HARDENED="$(codesign -dvv "$NODE_BIN" 2>&1 | grep -c 'CodeDirectory flags=.*runtime')"
          HAS_JIT="$(printf '%s' "$ENTITLEMENTS" | grep -c allow-jit)"
          if [ "${IS_HARDENED:-0}" -ge 1 ] && [ "${HAS_JIT:-0}" -eq 0 ]; then
            echo "::warning::node sidecar 在 hardened runtime 下缺少 allow-jit，重签并重打 dmg"
            if codesign --force --deep --sign - "$TEST_APP"; then
              echo "RESIGNED=1" >> "$GITHUB_ENV"
              echo "FIXED_APP=$TEST_APP" >> "$GITHUB_ENV"
            else
              warn "重签失败，跳过冒烟（产物按原样上传）"
            fi
          fi

          # ── 3) 尽力跑后端 ───────────────────────────────────────────────
          SCRIPT="$TEST_APP/Contents/Resources/server/server/index.js"
          [ -f "$SCRIPT" ] || SCRIPT="$TEST_APP/Contents/Resources/resources/server/server/index.js"
          echo "backend script: $SCRIPT"
          [ -f "$SCRIPT" ] || warn "找不到后端入口，跳过冒烟"
          DATA_DIR="$(mktemp -d)"
          BRAND_PORT="$(node scripts/brand.mjs port)"
          if [ "$EXPECT_ARCH" = "x86_64" ]; then
            echo "x64：通过 arch -x86_64 借助 Rosetta 执行"
            PORT="$BRAND_PORT" DATA_DIR="$DATA_DIR" arch -x86_64 "$NODE_BIN" "$SCRIPT" &
          else
            PORT="$BRAND_PORT" DATA_DIR="$DATA_DIR" "$NODE_BIN" "$SCRIPT" &
          fi
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:$BRAND_PORT/api/health"; then
              echo ""
              echo "SMOKE_OK"
              exit 0
            fi
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              wait "$NODE_PID" 2>/dev/null
              warn "后端启动后退出（${{ matrix.arch }}）"
            fi
            sleep 0.5
          done
          warn "后端 20s 内没有就绪（${{ matrix.arch }}）"

      # 兜底重签后 .app 的签名已变，用它重打 dmg，保证上传的安装包可直接运行。
      # 文件名必须按架构取：写死 aarch64 会让 x64 的包挂着一个错误的名字。
      - name: Repack dmg after re-sign
        if: env.RESIGNED == '1'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          rm -f "$BUNDLE_DIR"/*.dmg
          hdiutil create -volname "ezcanvas" -srcfolder "${FIXED_APP:?}" -ov -format UDZO "$BUNDLE_DIR/ezcanvas_${VERSION}_${{ matrix.dmg_arch }}.dmg"
          ls -la "$BUNDLE_DIR"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Windows：安装版 + Tauri 更新包（.nsis.zip + .sig）。
  #    自动更新只在 Windows 安装版上启用；便携版客户端会自己识别并只提示下载。
  build-windows:
    runs-on: windows-latest
    # 签名私钥可以放在仓库级 secrets，也可以放在这个环境的 secrets 里。
    # 声明 environment 后，作业能同时读到两者（同名时环境级优先）。
    environment: image_key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # 私钥丢了就再也无法给已装用户推送更新，所以它只存在两处：
      # 本机 %USERPROFILE%\.tauri\chatcanvas-updater.key，以及这个仓库 secret。
      - name: Check updater signing secret
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY。请在仓库 Settings → Secrets and variables → Actions 里添加更新签名私钥（chatcanvas-updater.key 的完整内容）。"
            exit 1
          fi

      - name: Build NSIS installer + updater artifacts
        run: node scripts/brand.mjs tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # ── 发布：等两边的产物都到齐再建 Release，保证 latest.json 里的 URL
  #    指向的资产此刻已经存在。顺序反过来的话，中间那段时间检查更新的用户
  #    会拿到一个下载 404 的地址。
  publish:
    needs: [build-macos, build-windows]
    # 手动触发且没填 release_tag 时只出产物、不建 Release：
    # 否则 github.ref_name 是分支名，会把 main 当成版本 tag 发出去
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS 两个架构是两个 artifact，用 pattern 一起拉下来合并到一个目录，
      # 否则 publish 里只会拿到最后上传的那一个。
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-dmg
          path: dist/macos
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: dist/windows

      - name: Prepare release notes
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const v=process.env.RELEASE_TAG; const text=fs.readFileSync(process.argv[1],"utf8"); const start=text.indexOf("## "+v+" "); if(start<0) throw Error("Missing changelog for "+v); const tail=text.slice(start); const end=tail.indexOf("\n## ",3); fs.writeFileSync("release-notes.md",end<0?tail:tail.slice(0,end));' "$(node scripts/brand.mjs changelog)"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/macos/*.dmg
            dist/windows/*.exe
            dist/windows/*.nsis.zip
            dist/windows/*.sig
          fail_on_unmatched_files: false

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          # Tauri 2 在 NSIS 下直接把**安装器 exe 本身**作为更新包并签名
          # （本地 2.11 实测只产出 setup.exe + setup.exe.sig，没有 .nsis.zip）。
          # 老版本/其它配置若产出 zip，则优先用 zip。
          ARTIFACT="$(find dist/windows -name '*.nsis.zip' | head -1)"
          if [ -z "$ARTIFACT" ]; then ARTIFACT="$(find dist/windows -name '*-setup.exe' | head -1)"; fi
          if [ -z "$ARTIFACT" ]; then echo "::error::没找到 Windows 更新包"; exit 1; fi
          if [ ! -f "${ARTIFACT}.sig" ]; then echo "::error::没找到 ${ARTIFACT}.sig"; exit 1; fi
          npx tsx scripts/write-latest-json.ts \
            --version "$VERSION" \
            --file-name "$(basename "$ARTIFACT")" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --signature "${ARTIFACT}.sig" \
            --out latest.json
          cat latest.json

      # 更新的地址是固定的 updater tag，而不是「最新 Release」：
      # 只要最新那个 Release 恰好缺了 Windows 资产，/releases/latest/download/
      # 就会 404，全体用户的检查更新一起失效。固定 tag 与这件事解耦。
      - name: Update updater manifest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updater
          name: updater
          body: "自动更新清单（latest.json），由 Release workflow 维护，请勿手动修改。"
          files: latest.json
          make_latest: false
          fail_on_unmatched_files: true
