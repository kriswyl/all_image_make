<!--
  ezcanvas 应用图标母版（1024×1024，透明底 + 白色 z）。
  用 npx tauri icon design/ezcanvas-app-icon.svg 生成 src-tauri/icons 全套。

  三个刻意的选择：
  1. 透明底、不要圆角方块——任务栏上就是一枚白 z，跟 ChatGPT 一个路子。
  2. z 占画布 78%（比图形标占得满），字母自己撑得住，不需要留太多白边。
  3. 描边 2.6（本地坐标）→ 落在 1024 上是 150px，笔画约占字高 19%。这是"粗体"而非"特粗"：
     再粗一点，16px 下 z 的中间斜杠就会和上下两横糊在一起。

  已知代价：白 z 在浅色桌面 / 浅色任务栏上会发虚。要换只改下面 stroke 一处
  （换成 #0d0d0d），几何不动。.ico 是一张死图，没法跟随系统主题，这里只能二选一。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ezcanvas</title>
  <g transform="translate(-182.8 -182.8) scale(57.9)" fill="none" stroke="#ffffff"
     stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.4 6.4h11.2L6.4 17.6h11.2"/>
  </g>
</svg>
